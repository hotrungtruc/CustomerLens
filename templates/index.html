<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 Hệ thống Nhận Diện Khuôn Mặt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1400px;
            width: 100%;
        }

        .camera-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .camera-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .camera-feed {
            width: 100%;
            height: auto;
            border-radius: 15px;
            border: 3px solid #667eea;
            background: #000;
        }

        .info-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .info-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .student-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #667eea;
            margin-bottom: 20px;
            background: #f0f0f0;
        }

        .student-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: bold;
            font-size: 14px;
        }

        .info-value {
            font-size: 14px;
            text-align: right;
            word-break: break-word;
        }

        .no-detection {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .no-detection p {
            font-size: 18px;
            margin-top: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Camera Section -->
        <div class="camera-section">
            <h2>📷 Camera</h2>
            <img src="/video_feed" class="camera-feed" alt="Camera Feed">
        </div>

        <!-- Info Section -->
        <div class="info-section">
            <h2>👤 Thông Tin Người Dùng</h2>
            <div id="info-container"></div>
        </div>
    </div>

    <script>
        const infoContainer = document.getElementById('info-container');

        /**
         * Sanitize HTML to prevent XSS attacks
         */
        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }

        function updateStudentInfo() {
            fetch('/api/student_info')
                .then(response => {
                    if (!response.ok) throw new Error('Network error');
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        let imgHtml = '';
                        if (data.image) {
                            imgHtml = `<img src="data:image/jpeg;base64,${escapeHtml(data.image)}" class="student-image" alt="Student Photo">`;
                        }

                        infoContainer.innerHTML = `
                            ${imgHtml}
                            <div class="student-info">
                                <div class="info-item">
                                    <span class="info-label">Họ tên:</span>
                                    <span class="info-value">${escapeHtml(data.name)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Mã SV:</span>
                                    <span class="info-value">${escapeHtml(data.id)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Ngành:</span>
                                    <span class="info-value">${escapeHtml(data.major)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Khóa:</span>
                                    <span class="info-value">${escapeHtml(data.year)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Năm bắt đầu:</span>
                                    <span class="info-value">${escapeHtml(data.starting_year)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Tổng điểm danh:</span>
                                    <span class="info-value">${escapeHtml(data.total_attendance)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Xếp loại:</span>
                                    <span class="info-value">${escapeHtml(data.standing)}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Lần cuối:</span>
                                    <span class="info-value">${escapeHtml(data.last_attendance_time)}</span>
                                </div>
                            </div>
                            <button onclick="checkIn(event)">✓ Điểm Danh</button>
                            <div id="message"></div>
                        `;
                    } else {
                        infoContainer.innerHTML = `
                            <div class="no-detection">
                                <span style="font-size: 60px;">👀</span>
                                <p>Chờ phát hiện khuôn mặt...</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    infoContainer.innerHTML = `<div class="message error">Lỗi kết nối</div>`;
                });
        }

        /**
         * Sanitize HTML to prevent XSS attacks
         */
        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }

        /**
         * Handle check-in button click with proper error handling
         */
        function checkIn(event) {
            const button = event.target;
            if (button.disabled) return;

            button.disabled = true;
            button.innerHTML = '<span class="spinner"></span> Đang xử lý...';

            fetch('/api/check_in', { method: 'POST' })
                .then(response => {
                    if (!response.ok) throw new Error('Request failed');
                    return response.json();
                })
                .then(data => {
                    const messageDiv = document.getElementById('message');
                    if (messageDiv) {
                        const className = data.success ? 'success' : 'warning';
                        messageDiv.innerHTML = `<div class="message ${className}">${escapeHtml(data.message)}</div>`;
                    }

                    if (data.success) {
                        setTimeout(() => { updateStudentInfo(); }, 1500);
                    } else {
                        button.disabled = false;
                        button.innerHTML = '✓ Điểm Danh';
                    }
                })
                .catch(error => {
                    console.error('Check-in error:', error);
                    const messageDiv = document.getElementById('message');
                    if (messageDiv) {
                        messageDiv.innerHTML = `<div class="message error">Lỗi: ${escapeHtml(error.message)}</div>`;
                    }
                    button.disabled = false;
                    button.innerHTML = '✓ Điểm Danh';
                });
        }

        // Initialize and start polling
        updateStudentInfo();
        setInterval(updateStudentInfo, 500);
    </script>
</body>

</html>
