name: CustomerLens CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. CI VALIDATION (Runs on PRs and Push to main)
  # -------------------------------------------------------------
  test-and-validate:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Core Unit Tests
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest \
            backend/tests/test_jwt_auth.py \
            backend/tests/test_biometric_security.py \
            backend/tests/test_audit_fixes.py

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Next.js Production Build
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------
  # 2. CD DEPLOYMENT (Only triggers on push to main or dispatch,
  #    and only AFTER test-and-validate succeeds)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to EC2 Master & Workers + Vercel
    needs: [test-and-validate]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MASTER_IP: "15.134.121.250"
      WORKER_IPS: "54.253.192.210 54.252.191.145"
      EC2_USER: "ubuntu"
      VERCEL_HOOK_URL: "https://api.vercel.com/v1/integrations/deploy/prj_Vmv6iLCAw6ZytseXSJWfnc9lQuUh/gb78OB9lIG"

    steps:
      - name: Configure SSH Keys & Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Master SSH Key
          echo "${{ secrets.MASTER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/master.pem
          chmod 400 ~/.ssh/master.pem

          # Workers SSH Key
          echo "${{ secrets.WORKERS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/workers.pem
          chmod 400 ~/.ssh/workers.pem

          # Scan host keys with timeout
          ssh-keyscan -T 10 -H "$MASTER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          for IP in $WORKER_IPS; do
            ssh-keyscan -T 10 -H "$IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          done

      - name: Deploy Master Node (Backend, Redis, Redpanda, Nginx)
        run: |
          echo "=== 1/3. Deploying to Master Node ($MASTER_IP) ==="
          ssh -i ~/.ssh/master.pem -o ConnectTimeout=15 -o StrictHostKeyChecking=no "$EC2_USER@$MASTER_IP" '
            set -e

            # Auto-detect project directory
            if [ -d "/home/ubuntu/CustomerLens" ]; then
              APP_DIR="/home/ubuntu/CustomerLens"
            elif [ -d "/home/ubuntu/face-recognition-system" ]; then
              APP_DIR="/home/ubuntu/face-recognition-system"
            else
              echo "Error: Application directory not found on Master!" && exit 1
            fi

            echo "Target directory: $APP_DIR"
            cd "$APP_DIR"

            echo "--- Fetching latest code from origin/main ---"
            git fetch origin main
            git reset --hard origin/main

            echo "--- Fast rebuild & restart Docker services with cache ---"
            sudo docker compose up --build -d backend redis redpanda ai_worker
            sudo docker image prune -f

            echo "--- Checking Nginx configuration ---"
            if command -v nginx &>/dev/null; then
              sudo nginx -t && sudo systemctl reload nginx || true
            fi

            echo "--- Verifying backend health check (with retry loop) ---"
            HEALTHY=0
            for i in $(seq 1 6); do
              echo "Health check attempt $i/6 (waiting for backend)..."
              if curl -sf http://127.0.0.1:8000/api/health >/dev/null || curl -sf http://127.0.0.1:8000/docs >/dev/null; then
                echo "✅ Master backend healthy!"
                HEALTHY=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "❌ Backend health check failed after 30 seconds!"
              echo "--- Recent container logs ---"
              sudo docker compose logs --tail 40 backend
              exit 1
            fi
          '

      - name: Deploy Worker Nodes (Inference Engine)
        run: |
          echo "=== 2/3. Deploying to Worker Nodes ($WORKER_IPS) ==="
          for WORKER_IP in $WORKER_IPS; do
            echo "--- Deploying to Worker: $WORKER_IP ---"
            ssh -i ~/.ssh/workers.pem -o ConnectTimeout=15 -o StrictHostKeyChecking=no "$EC2_USER@$WORKER_IP" '
              set -e

              # Auto-detect project directory
              if [ -d "/home/ubuntu/CustomerLens" ]; then
                APP_DIR="/home/ubuntu/CustomerLens"
              elif [ -d "/home/ubuntu/face-recognition-system" ]; then
                APP_DIR="/home/ubuntu/face-recognition-system"
              else
                echo "Error: Application directory not found on Worker!" && exit 1
              fi

              echo "Target directory: $APP_DIR"
              cd "$APP_DIR"

              echo "--- Fetching latest code on Worker ---"
              git fetch origin main
              git reset --hard origin/main

              # Option A: Systemd service (face-api)
              if sudo systemctl is-active --quiet face-api; then
                echo "Restarting Systemd service face-api..."
                sudo systemctl restart face-api
              fi

              # Option B: Docker Compose worker
              if [ -f "docker-compose.worker.yml" ]; then
                echo "Restarting Docker Compose ai_worker..."
                sudo docker compose -f docker-compose.worker.yml up -d --build ai_worker || true
                sudo docker image prune -f
              elif [ -f "docker-compose.yml" ]; then
                sudo docker compose up -d --build ai_worker || true
                sudo docker image prune -f
              fi
            '
          done

      - name: Trigger Vercel Frontend Deployment
        run: |
          echo "=== 3/3. Triggering Vercel Frontend Deployment Hook ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_HOOK_URL")
          echo "Vercel Deploy Hook response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Vercel deploy triggered successfully."
          else
            echo "❌ Error: Vercel deploy hook returned $HTTP_CODE"
            exit 1
          fi
