services:
  backend:
    image: face-recognition-system-backend:latest
    container_name: faceai_backend
    restart: unless-stopped
    ports:
      # Bind only to localhost so Nginx is the only entry point
      - "0.0.0.0:8000:8000"
    volumes:
      # Persistent data outside the container - survives rebuilds
      - /srv/faceai/models:/app/models:ro
      - /srv/faceai/data:/app/data
      - ./backend/config.py:/app/config.py:ro
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    # Limit memory to prevent OOM kills on T3.micro
    mem_limit: 600m
    mem_reservation: 300m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: faceai_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 100m

  ai_worker:
    image: face-recognition-system-backend:latest
    container_name: faceai_worker
    restart: unless-stopped
    command: python app/ai_worker.py
    volumes:
      - /srv/faceai/models:/app/models:ro
      - /srv/faceai/data:/app/data
      - ./backend/config.py:/app/config.py:ro
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    depends_on:
      - redis

volumes:
  redis_data:
