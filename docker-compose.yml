services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: customerlens-backend:latest
    container_name: customerlens_backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      # Persistent data outside the container - survives rebuilds
      - ./backend/models:/app/models:ro
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts:ro
      - ./backend/config.py:/app/config.py:ro
      - ./backend/db_config.py:/app/db_config.py:ro
      - ./backend/asgi.py:/app/asgi.py:ro
      - ./backend/app:/app/app:ro
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - RECOGNIZER_MODEL=edgeface
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    # Limit memory to prevent OOM kills on T3.micro
    mem_limit: 600m
    mem_reservation: 300m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: customerlens_redis
    restart: unless-stopped
    ports:
      - "0.0.0.0:6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 100m

  ai_worker:
    image: customerlens-backend:latest
    container_name: customerlens_worker
    restart: unless-stopped
    command: python app/ai_worker.py
    volumes:
      - ./backend/models:/app/models:ro
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts:ro
      - ./backend/config.py:/app/config.py:ro
      - ./backend/db_config.py:/app/db_config.py:ro
      - ./backend/app:/app/app:ro
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - RECOGNIZER_MODEL=edgeface
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    depends_on:
      - redis
      - redpanda

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: customerlens_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://${MASTER_ADVERTISE_IP:-172.31.9.172}:9092
    ports:
      - "0.0.0.0:9092:9092"
      - "0.0.0.0:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

volumes:
  redis_data:
  redpanda_data:
