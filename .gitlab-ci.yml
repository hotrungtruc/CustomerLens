stages:
  - deploy

variables:
  MASTER_IP: "15.134.121.250"
  WORKER_IPS: "54.253.192.210 54.252.191.145"
  EC2_USER: "ubuntu"

deploy_production:
  stage: deploy
  only:
    - main
  before_script:
    - which ssh-agent || (apt-get update -y && apt-get install openssh-client curl -y)
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Load SSH Private Keys from CI/CD Variables
    - echo "$MASTER_SSH_KEY" | tr -d '\r' > ~/.ssh/master.pem
    - chmod 400 ~/.ssh/master.pem
    - echo "$WORKERS_SSH_KEY" | tr -d '\r' > ~/.ssh/workers.pem
    - chmod 400 ~/.ssh/workers.pem

  script:
    - echo "=== 1/3. Deploying to Master Node ($MASTER_IP) ==="
    - ssh-keyscan -H "$MASTER_IP" >> ~/.ssh/known_hosts 2>/dev/null
    - |
      ssh -i ~/.ssh/master.pem -o StrictHostKeyChecking=no "$EC2_USER@$MASTER_IP" '
        set -e
        # Auto-detect repository path
        if [ -d "/home/ubuntu/CustomerLens" ]; then
          APP_DIR="/home/ubuntu/CustomerLens"
        elif [ -d "/home/ubuntu/face-recognition-system" ]; then
          APP_DIR="/home/ubuntu/face-recognition-system"
        else
          echo "Error: Application directory not found on Master!" && exit 1
        fi

        echo "Target directory: $APP_DIR"
        cd "$APP_DIR"
        git fetch origin main
        git reset --hard origin/main

        # Rebuild and restart Master backend services
        sudo docker compose down --timeout 30 || true
        sudo docker system prune -af
        sudo docker compose up --build -d backend redis redpanda ai_worker
        sudo docker image prune -f

        # Reload Nginx if config changed
        if [ -f "/etc/nginx/sites-available/api.checkinface.me" ]; then
          sudo nginx -t && sudo systemctl reload nginx || true
        fi
      '

    - echo "=== 2/3. Deploying to Worker Nodes ($WORKER_IPS) ==="
    - |
      for WORKER_IP in $WORKER_IPS; do
        echo "--- Deploying to Worker: $WORKER_IP ---"
        ssh-keyscan -H "$WORKER_IP" >> ~/.ssh/known_hosts 2>/dev/null
        ssh -i ~/.ssh/workers.pem -o StrictHostKeyChecking=no "$EC2_USER@$WORKER_IP" '
          set -e
          if [ -d "/home/ubuntu/CustomerLens" ]; then
            APP_DIR="/home/ubuntu/CustomerLens"
          elif [ -d "/home/ubuntu/face-recognition-system" ]; then
            APP_DIR="/home/ubuntu/face-recognition-system"
          else
            echo "Error: Application directory not found on Worker!" && exit 1
          fi

          echo "Target directory: $APP_DIR"
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main

          # Option A: Systemd service (face-api)
          if sudo systemctl is-active --quiet face-api; then
            echo "Restarting Systemd service face-api..."
            sudo systemctl restart face-api
          fi

          # Option B: Docker Compose worker
          if [ -f "docker-compose.worker.yml" ]; then
            echo "Restarting Docker Compose ai_worker..."
            sudo docker compose -f docker-compose.worker.yml down --timeout 15 || true
            sudo docker compose -f docker-compose.worker.yml up -d --build ai_worker || true
            sudo docker image prune -f
          elif [ -f "docker-compose.yml" ]; then
            sudo docker compose up -d --build ai_worker || true
            sudo docker image prune -f
          fi
        '
      done

    - echo "=== 3/3. Triggering Vercel Frontend Build ==="
    - |
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.vercel.com/v1/integrations/deploy/prj_Vmv6iLCAw6ZytseXSJWfnc9lQuUh/gb78OB9lIG")
      echo "Vercel Deploy Hook HTTP response: $HTTP_CODE"
