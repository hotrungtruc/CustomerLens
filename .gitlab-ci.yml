stages:
  - deploy

deploy_production:
  stage: deploy
  # Only run on pushes to the main branch
  only:
    - main
  # Use the Docker executor or shell runner on GitLab's shared runners
  # We SSH into EC2 directly - no container registry needed
  before_script:
    - which ssh-agent || (apt-get update -y && apt-get install openssh-client -y)
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Load Master key
    - echo "$MASTER_SSH_KEY" | tr -d '\r' > ~/.ssh/master.pem
    - chmod 400 ~/.ssh/master.pem
    # Load Workers key
    - echo "$WORKERS_SSH_KEY" | tr -d '\r' > ~/.ssh/workers.pem
    - chmod 400 ~/.ssh/workers.pem
  script:
    - echo "=== Deploying to Master ($MASTER_IP) ==="
    - ssh-keyscan -H "$MASTER_IP" >> ~/.ssh/known_hosts 2>/dev/null
    - |
      ssh -i ~/.ssh/master.pem -o StrictHostKeyChecking=no "$EC2_USER@$MASTER_IP" << 'ENDSSH'
        set -e
        echo "--- Pulling latest code on Master ---"
        cd /home/ubuntu/face-recognition-system
        git fetch origin main
        git reset --hard origin/main

        echo "--- Rebuilding and restarting container ---"
        sudo docker compose down --timeout 30
        sudo docker compose up --build -d
        sudo docker image prune -f
      ENDSSH

    - echo "=== Deploying to Workers ==="
    - |
      for WORKER_IP in $WORKER_IPS; do
        echo "--- Deploying to Worker: $WORKER_IP ---"
        ssh-keyscan -H "$WORKER_IP" >> ~/.ssh/known_hosts 2>/dev/null
        ssh -i ~/.ssh/workers.pem -o StrictHostKeyChecking=no "$EC2_USER@$WORKER_IP" << 'ENDSSH'
          set -e
          echo "--- Pulling latest code on Worker ---"
          cd /home/ubuntu/face-recognition-system
          git fetch origin main
          git reset --hard origin/main

          echo "--- Rebuilding and restarting container ---"
          sudo docker compose down --timeout 30
          sudo docker compose up --build -d
          sudo docker image prune -f
        ENDSSH
      done

    - echo "=== Triggering Vercel Frontend Build ==="
    - curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_Vmv6iLCAw6ZytseXSJWfnc9lQuUh/gb78OB9lIG"
