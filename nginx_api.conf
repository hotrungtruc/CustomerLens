server {
    server_name api.checkinface.me _;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    listen 443 ssl;
    # Cloudflare Origin Certificate (thay thế Let's Encrypt)
    ssl_certificate     /etc/ssl/certs/cloudflare_origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;

    # Chỉ chấp nhận kết nối từ dải IP của Cloudflare (bảo vệ origin)
    # Các IP này được Cloudflare công bố tại: https://www.cloudflare.com/ips/
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
}

server {
    if ($host = api.checkinface.me) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name api.checkinface.me _;
    return 404;
}
